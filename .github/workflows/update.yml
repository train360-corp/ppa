name: Pre-Pull Checks

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  update:
    name: Check Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run update script
        run: ./update.sh
        env:
          KEY: ${{ secrets.KEY }}

      - name: Verify no changes left uncommitted
        run: |
          if ! git diff --quiet; then
            echo "::error::update.sh produced changes. Please run ./update.sh locally and commit the results."
            git diff --stat
            exit 1
          fi
